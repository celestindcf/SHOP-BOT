<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Shop — Panel Vendeur</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0b0f14;color:#e0e0e0;font-family:'Segoe UI',sans-serif;padding:20px}
    .container{max-width:1400px;margin:0 auto}
    h1{color:#ff4757;margin-bottom:10px}
    h2{color:#a29bfe;margin-bottom:15px;font-size:18px}
    .card{background:#141a24;border:1px solid #1e2535;border-radius:8px;padding:20px;margin-bottom:20px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #1e2535}
    th{color:#4a5568;font-size:11px;text-transform:uppercase}
    .status{display:inline-block;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:bold}
    .status.en_attente{background:#ffd32a22;color:#ffd32a}
    .status.validee{background:#2ed57322;color:#2ed573}
    .status.livree{background:#5352ed22;color:#a29bfe}
    .status.refusee{background:#ff475722;color:#ff4757}
    button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-right:5px;font-size:12px}
    .btn-success{background:#2ed573;color:#000}
    .btn-danger{background:#ff4757;color:#fff}
    .btn-primary{background:#5352ed;color:#fff}
    .btn-warning{background:#ff9f43;color:#000}
    .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .tabs{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap}
    .tab{padding:10px 20px;background:#1a1f2a;border:none;color:#e0e0e0;cursor:pointer;border-radius:6px 6px 0 0}
    .tab.active{background:#5352ed}
    input,select,textarea{width:100%;padding:12px;background:#1a1f2a;border:1px solid #1e2535;border-radius:6px;color:#fff;margin-bottom:15px}
    .pack-tag{display:inline-block;background:#5352ed33;color:#a29bfe;padding:2px 8px;border-radius:4px;font-size:11px;margin:2px}
    .flocage-preview{max-width:60px;max-height:60px;border-radius:4px;object-fit:cover}
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>🛡️ Panel Vendeur — RP Shop</h1>
      
      <div class="tabs">
        <button class="tab active" onclick="showTab('orders', event)">📋 Commandes</button>
        <button class="tab" onclick="showTab('catalogue', event)">📦 Articles</button>
        <button class="tab" onclick="showTab('cars', event)">🚗 Voitures</button>
        <button class="tab" onclick="showTab('accessories', event)">🔧 Accessoires</button>
      </div>
      
      <!-- Commandes -->
      <div id="tab-orders">
        <div class="flex" style="margin-bottom:15px">
          <select id="status-filter" onchange="loadOrders()" style="width:200px;margin-bottom:0">
            <option value="">Toutes</option>
            <option value="en_attente">🟡 En attente</option>
            <option value="validee">🟢 Validées</option>
            <option value="livree">✅ Livrées</option>
            <option value="refusee">🔴 Refusées</option>
          </select>
        </div>
        <div class="card">
          <table id="orders-table">
            <thead><tr><th>ID</th><th>Client</th><th>Articles</th><th>Détails</th><th>Flocage</th><th>Date</th><th>Statut</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <!-- Articles -->
      <div id="tab-catalogue" style="display:none">
        <div class="flex" style="margin-bottom:15px">
          <button class="btn-primary" onclick="openAddModal('item')">➕ Nouvel article</button>
        </div>
        <div class="card">
          <table id="shop-table">
            <thead><tr><th>Image</th><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Description</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <!-- Voitures -->
      <div id="tab-cars" style="display:none">
        <div class="flex" style="margin-bottom:15px">
          <button class="btn-primary" onclick="openAddModal('voiture')">➕ Nouvelle voiture</button>
        </div>
        <div class="card">
          <table id="cars-table">
            <thead><tr><th>Image</th><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Pack inclus</th><th>Flocage</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <!-- Accessoires -->
      <div id="tab-accessories" style="display:none">
        <div class="flex" style="margin-bottom:15px">
          <button class="btn-primary" onclick="openAddModal('accessoire')">➕ Nouvel accessoire</button>
        </div>
        <div class="card">
          <table id="acc-table">
            <thead><tr><th>Image</th><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Description</th><th>Flocage</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modal Ajout -->
  <div id="add-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000;padding:20px">
    <div style="background:#141a24;padding:25px;border-radius:8px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto">
      <h3 style="margin-bottom:20px;color:#a29bfe" id="modal-title">➕ Ajouter</h3>
      <input type="text" id="item-nom" placeholder="Nom *">
      <input type="text" id="item-categorie" placeholder="Catégorie *">
      <input type="number" id="item-prix" placeholder="Prix (optionnel)">
      <textarea id="item-desc" placeholder="Description" rows="3"></textarea>
      <input type="text" id="item-image" placeholder="URL Image (optionnel)">
      <div id="pack-field" style="display:none">
        <input type="text" id="item-pack" placeholder="Pack inclus (séparés par virgule)">
        <small style="color:#4a5568;display:block;margin-bottom:15px">Ex: Flocage, Jantes sport, Vitres teintées</small>
      </div>
      <div id="flocage-field" style="display:none">
        <input type="text" id="item-flocage" placeholder="URL image flocage (optionnel)">
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn-primary" onclick="addItem()">Ajouter</button>
        <button onclick="closeModal()" style="background:#1a1f2a;color:#fff">Annuler</button>
      </div>
    </div>
  </div>

  <script>
    const guildId = new URLSearchParams(location.search).get('guild') || '';
    let orders = [], items = [], cars = [], accessories = [];
    let currentType = 'item';
    
    async function loadOrders() {
      const res = await fetch(`/api/orders?guild=${guildId}`);
      orders = await res.json();
      const filter = document.getElementById('status-filter').value;
      let filtered = filter ? orders.filter(o => o.status === filter) : orders;
      const st = {'en_attente':'🟡 Attente','validee':'🟢 Validée','livree':'✅ Livrée','refusee':'🔴 Refusée'};
      document.querySelector('#orders-table tbody').innerHTML = filtered.map(o => `
        <tr>
          <td><code>${o.orderId}</code></td>
          <td>${o.userTag || o.userId}</td>
          <td>${o.items.map(i => `${i.quantite}x ${i.nom}${i.pack?.length ? ` <span class="pack-tag">📦 ${i.pack.join(', ')}</span>` : ''}`).join('<br>')}</td>
          <td>${o.details || '-'}</td>
          <td>${o.flocage ? `<a href="${o.flocage}" target="_blank"><img src="${o.flocage}" class="flocage-preview"></a>` : '-'}</td>
          <td>${new Date(o.createdAt).toLocaleDateString('fr-FR')}</td>
          <td><span class="status ${o.status}">${st[o.status]}</span></td>
          <td>${o.status==='en_attente'?`<button class="btn-success" onclick="updateOrder('${o.orderId}','validee')">✅</button>`:''}${o.status==='validee'?`<button class="btn-primary" onclick="updateOrder('${o.orderId}','livree')">🚚</button>`:''}${o.status==='en_attente'?`<button class="btn-danger" onclick="refuseOrder('${o.orderId}')">❌</button>`:''}</td>
        </tr>
      `).join('');
    }
    
    async function updateOrder(id, status) {
      await fetch(`/api/orders/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guild: guildId, status }) });
      loadOrders();
    }
    
    async function refuseOrder(id) {
      const raison = prompt('Raison (optionnel) :') || 'Aucune';
      await fetch(`/api/orders/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guild: guildId, status: 'refusee', raisonRefus: raison }) });
      loadOrders();
    }
    
    async function loadShop() {
      const res = await fetch(`/api/shop?guild=${guildId}&type=item`);
      items = await res.json();
      document.querySelector('#shop-table tbody').innerHTML = items.map(i => `
        <tr><td>${i.image ? `<img src="${i.image}" style="width:40px;height:40px;object-fit:cover;border-radius:4px">` : '📦'}</td><td><strong>${i.nom}</strong><br><code>${i.id}</code></td><td>${i.categorie||'-'}</td><td>${i.prix ? i.prix+'💰' : '-'}</td><td>${i.description||'-'}</td>
        <td><button class="btn-warning" onclick="editItem('${i.id}')">✏️</button><button class="btn-danger" onclick="deleteItem('${i.id}')">🗑️</button></td></tr>
      `).join('');
    }
    
    async function loadCars() {
      const res = await fetch(`/api/cars?guild=${guildId}`);
      cars = await res.json();
      document.querySelector('#cars-table tbody').innerHTML = cars.map(i => `
        <tr>
          <td>${i.image ? `<img src="${i.image}" style="width:50px;height:40px;object-fit:cover;border-radius:4px">` : '🚗'}</td>
          <td><strong>${i.nom}</strong><br><code>${i.id}</code></td>
          <td>${i.categorie||'-'}</td>
          <td>${i.prix ? i.prix+'💰' : '-'}</td>
          <td>${i.pack?.length ? i.pack.map(p => `<span class="pack-tag">${p}</span>`).join('') : '-'}</td>
          <td>${i.flocageImage ? `<a href="${i.flocageImage}" target="_blank"><img src="${i.flocageImage}" class="flocage-preview"></a>` : '-'}</td>
          <td><button class="btn-warning" onclick="editItem('${i.id}')">✏️</button><button class="btn-danger" onclick="deleteItem('${i.id}')">🗑️</button></td>
        </tr>
      `).join('');
    }
    
    async function loadAccessories() {
      const res = await fetch(`/api/cars/accessories?guild=${guildId}`);
      accessories = await res.json();
      document.querySelector('#acc-table tbody').innerHTML = accessories.map(i => `
        <tr>
          <td>${i.image ? `<img src="${i.image}" style="width:40px;height:40px;object-fit:cover;border-radius:4px">` : '🔧'}</td>
          <td><strong>${i.nom}</strong><br><code>${i.id}</code></td>
          <td>${i.categorie||'-'}</td>
          <td>${i.prix ? i.prix+'💰' : '-'}</td>
          <td>${i.description||'-'}</td>
          <td>${i.flocageImage ? `<a href="${i.flocageImage}" target="_blank"><img src="${i.flocageImage}" class="flocage-preview"></a>` : '-'}</td>
          <td><button class="btn-warning" onclick="editItem('${i.id}')">✏️</button><button class="btn-danger" onclick="deleteItem('${i.id}')">🗑️</button></td>
        </tr>
      `).join('');
    }
    
    function showTab(t, ev) {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      if (ev) ev.target.classList.add('active');
      document.getElementById('tab-orders').style.display = t === 'orders' ? 'block' : 'none';
      document.getElementById('tab-catalogue').style.display = t === 'catalogue' ? 'block' : 'none';
      document.getElementById('tab-cars').style.display = t === 'cars' ? 'block' : 'none';
      document.getElementById('tab-accessories').style.display = t === 'accessories' ? 'block' : 'none';
    }
    
    function openAddModal(type) {
      currentType = type;
      document.getElementById('modal-title').textContent = type === 'voiture' ? '🚗 Ajouter une voiture' : type === 'accessoire' ? '🔧 Ajouter un accessoire' : '➕ Ajouter un article';
      document.getElementById('pack-field').style.display = type === 'voiture' ? 'block' : 'none';
      document.getElementById('flocage-field').style.display = (type === 'voiture' || type === 'accessoire') ? 'block' : 'none';
      document.getElementById('item-nom').value = '';
      document.getElementById('item-categorie').value = '';
      document.getElementById('item-prix').value = '';
      document.getElementById('item-desc').value = '';
      document.getElementById('item-image').value = '';
      document.getElementById('item-pack').value = '';
      document.getElementById('item-flocage').value = '';
      document.getElementById('add-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('add-modal').style.display = 'none'; }
    
    async function addItem() {
      const nom = document.getElementById('item-nom').value;
      const categorie = document.getElementById('item-categorie').value;
      if (!nom || !categorie) return alert('Nom et catégorie requis');
      const body = {
        guild: guildId,
        nom, categorie,
        type: currentType,
        prix: parseInt(document.getElementById('item-prix').value) || null,
        description: document.getElementById('item-desc').value,
        image: document.getElementById('item-image').value,
        pack: currentType === 'voiture' ? document.getElementById('item-pack').value : '',
        flocageImage: (currentType === 'voiture' || currentType === 'accessoire') ? document.getElementById('item-flocage').value : ''
      };
      await fetch('/api/shop', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      closeModal();
      if (currentType === 'voiture') loadCars();
      else if (currentType === 'accessoire') loadAccessories();
      else loadShop();
    }
    
    async function deleteItem(id) {
      if (!confirm('Supprimer ?')) return;
      await fetch(`/api/shop/${id}?guild=${guildId}`, { method: 'DELETE' });
      loadShop(); loadCars(); loadAccessories();
    }
    
    function editItem(id) {
      const item = items.find(i => i.id === id) || cars.find(i => i.id === id) || accessories.find(i => i.id === id);
      if (!item) return;
      const prix = prompt('Prix :', item.prix || '');
      const desc = prompt('Description :', item.description || '');
      const cat = prompt('Catégorie :', item.categorie || '');
      let pack = null, flocage = null;
      if (item.type === 'voiture') {
        pack = prompt('Pack (séparés par virgule) :', (item.pack || []).join(', '));
      }
      if (item.type === 'voiture' || item.type === 'accessoire') {
        flocage = prompt('URL flocage :', item.flocageImage || '');
      }
      const upd = {};
      if (prix !== null && prix !== '') upd.prix = parseInt(prix) || null;
      if (desc !== null) upd.description = desc;
      if (cat !== null && cat !== '') upd.categorie = cat;
      if (pack !== null) upd.pack = pack;
      if (flocage !== null) upd.flocageImage = flocage;
      if (Object.keys(upd).length) {
        fetch(`/api/shop/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guild: guildId, ...upd }) }).then(() => { loadShop(); loadCars(); loadAccessories(); });
      }
    }
    
    loadOrders();
    loadShop();
    loadCars();
    loadAccessories();
  </script>
</body>
</html>
